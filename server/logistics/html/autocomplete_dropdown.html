{% block extrastyle %}
<style>
/* 表格化样式 */
.select2-results__option {
    display: table-row !important;
}
.select2-results__option--highlighted {
    background: #f8f9fa !important;
    color: #333 !important;
}
.autocomplete-table {
    display: table;
    width: 100%;
}
.autocomplete-row {
    display: table-row;
}
.autocomplete-cell {
    display: table-cell;
    padding: 8px;
    border-bottom: 1px solid #dee2e6;
    min-width: 120px;
    white-space: nowrap;
}
.header-cell {
    font-weight: bold;
    background: #f8f9fa;
}
</style>
{% endblock %}

{% block content %}
<div class="autocomplete-table">
    <div class="autocomplete-row header-row">
        <div class="autocomplete-cell header-cell">商品名称</div>
        <div class="autocomplete-cell header-cell">规格</div>
        <div class="autocomplete-cell header-cell">库存</div>
        <div class="autocomplete-cell header-cell">价格</div>
    </div>
    {% for result in results %}
    <div class="autocomplete-row" data-id="{{ result.id }}">
        <div class="autocomplete-cell">{{ result.name }}</div>
        <div class="autocomplete-cell">{{ result.sezes }}</div>
        <div class="autocomplete-cell">{{ result.stock }}</div>
        <div class="autocomplete-cell">¥{{ result.price }}</div>
    </div>
    {% endfor %}
</div>
{% endblock %}
